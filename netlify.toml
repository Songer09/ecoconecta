[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  VITE_API_BASE_URL = "/api/v1"

[[redirects]]
  from = "/api/v1/*"
  to = "https://backend-production-e3cd6aec.up.railway.app/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
