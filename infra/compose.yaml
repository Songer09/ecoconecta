services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ecoconecta
      POSTGRES_USER: ecoconecta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local environment}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoconecta -d ecoconecta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
