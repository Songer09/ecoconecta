[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compost-ai"
version = "0.1.0"
description = "Technology-independent waste image recognition service"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "python-multipart==0.0.20",
  "Pillow==11.2.1",
  "numpy==2.2.5",
  "scikit-learn==1.6.1",
  "joblib==1.5.0",
  "pydantic==2.11.4",
  "PyYAML==6.0.2",
  "transformers==4.51.3",
  "torch==2.7.0",
  "torchvision==0.22.0",
  "pandas==2.2.3",
  "scipy==1.15.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
