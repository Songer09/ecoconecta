[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoconecta-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.32,<1",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<0.29"]

[tool.setuptools.packages.find]
include = ["ecoconecta*"]
